<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-label="Abstract monochrome robot head with glowing eyes">
  <defs>
    <radialGradient id="heroGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="1200" fill="#000000"/>

  <!-- Ambient glow behind the head -->
  <circle cx="600" cy="560" r="430" fill="url(#heroGlow)"/>

  <!-- Halo rings (radar motif) -->
  <circle cx="600" cy="560" r="500" fill="none" stroke="#262626" stroke-width="1.5"/>
  <circle cx="600" cy="560" r="440" fill="none" stroke="#262626" stroke-width="1.5"/>
  <circle cx="600" cy="560" r="380" fill="none" stroke="#262626" stroke-width="1.5"/>
  <circle cx="600" cy="560" r="320" fill="none" stroke="#8A8A8A" stroke-width="1" opacity="0.35"/>

  <!-- Antenna -->
  <line x1="600" y1="280" x2="600" y2="190" stroke="#D4D4D4" stroke-width="2"/>
  <circle cx="600" cy="178" r="12" fill="#FFFFFF"/>

  <!-- Helmet -->
  <rect x="350" y="280" width="500" height="560" rx="120" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="3"/>

  <!-- Rim light along the left edge -->
  <path d="M 470 280 A 120 120 0 0 0 350 400 L 350 690" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.9"/>

  <!-- Face panel -->
  <rect x="400" y="340" width="400" height="440" rx="80" fill="#262626" stroke="#8A8A8A" stroke-width="1.5"/>

  <!-- Circuit details on the face -->
  <circle cx="430" cy="380" r="3" fill="#8A8A8A"/>
  <circle cx="770" cy="380" r="3" fill="#8A8A8A"/>
  <circle cx="430" cy="740" r="3" fill="#8A8A8A"/>
  <circle cx="770" cy="740" r="3" fill="#8A8A8A"/>
  <path d="M 596 380 h 8 M 600 376 v 8" stroke="#8A8A8A" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 596 740 h 8 M 600 736 v 8" stroke="#8A8A8A" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Scan line -->
  <line x1="400" y1="560" x2="800" y2="560" stroke="#D4D4D4" stroke-width="1" opacity="0.25"/>

  <!-- Eyes with glow -->
  <circle cx="520" cy="520" r="52" fill="url(#eyeGlow)"/>
  <circle cx="680" cy="520" r="52" fill="url(#eyeGlow)"/>
  <circle cx="520" cy="520" r="26" fill="#FFFFFF"/>
  <circle cx="680" cy="520" r="26" fill="#FFFFFF"/>

  <!-- Mouth -->
  <line x1="560" y1="660" x2="640" y2="660" stroke="#D4D4D4" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="580" cy="690" r="4" fill="#8A8A8A"/>
  <circle cx="600" cy="690" r="4" fill="#8A8A8A"/>
  <circle cx="620" cy="690" r="4" fill="#8A8A8A"/>

  <!-- Ears -->
  <rect x="330" y="470" width="20" height="90" rx="10" fill="#262626" stroke="#8A8A8A" stroke-width="1.5"/>
  <rect x="850" y="470" width="20" height="90" rx="10" fill="#262626" stroke="#8A8A8A" stroke-width="1.5"/>

  <!-- Neck -->
  <rect x="520" y="840" width="160" height="90" fill="#0A0A0A" stroke="#8A8A8A" stroke-width="1.5"/>

  <!-- Shoulders -->
  <rect x="280" y="930" width="640" height="130" rx="65" fill="#0A0A0A" stroke="#262626" stroke-width="2"/>
  <line x1="480" y1="930" x2="480" y2="1060" stroke="#262626" stroke-width="1.5"/>
  <line x1="720" y1="930" x2="720" y2="1060" stroke="#262626" stroke-width="1.5"/>
</svg>