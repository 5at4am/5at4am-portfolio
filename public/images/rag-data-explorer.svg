<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Monochrome data exploration: CSV table, search lens, and neural nodes">
  <defs>
    <radialGradient id="ragGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="800" fill="#000000"/>

  <!-- Ambient glow -->
  <circle cx="600" cy="400" r="400" fill="url(#ragGlow)"/>

  <!-- CSV table -->
  <rect x="120" y="200" width="380" height="400" rx="8" fill="#0A0A0A" stroke="#8A8A8A" stroke-width="2"/>
  <rect x="120" y="200" width="380" height="56" rx="8" fill="#262626"/>
  <line x1="120" y1="256" x2="500" y2="256" stroke="#262626" stroke-width="1.5"/>
  <line x1="246" y1="200" x2="246" y2="600" stroke="#262626" stroke-width="1.5"/>
  <line x1="372" y1="200" x2="372" y2="600" stroke="#262626" stroke-width="1.5"/>
  <line x1="120" y1="312" x2="500" y2="312" stroke="#262626" stroke-width="1.5"/>
  <line x1="120" y1="368" x2="500" y2="368" stroke="#262626" stroke-width="1.5"/>
  <line x1="120" y1="424" x2="500" y2="424" stroke="#262626" stroke-width="1.5"/>
  <line x1="120" y1="480" x2="500" y2="480" stroke="#262626" stroke-width="1.5"/>
  <line x1="120" y1="536" x2="500" y2="536" stroke="#262626" stroke-width="1.5"/>

  <!-- Header indicators -->
  <rect x="140" y="220" width="24" height="16" rx="3" fill="#FFFFFF"/>
  <rect x="266" y="220" width="24" height="16" rx="3" fill="#D4D4D4"/>
  <rect x="392" y="220" width="24" height="16" rx="3" fill="#8A8A8A"/>

  <!-- Data cells -->
  <circle cx="160" cy="284" r="5" fill="#8A8A8A"/>
  <circle cx="280" cy="284" r="5" fill="#8A8A8A"/>
  <circle cx="400" cy="284" r="5" fill="#8A8A8A"/>
  <circle cx="160" cy="340" r="5" fill="#8A8A8A"/>
  <circle cx="280" cy="340" r="5" fill="#FFFFFF"/>
  <circle cx="400" cy="340" r="5" fill="#8A8A8A"/>
  <circle cx="160" cy="396" r="5" fill="#8A8A8A"/>
  <circle cx="280" cy="396" r="5" fill="#8A8A8A"/>
  <circle cx="400" cy="396" r="5" fill="#8A8A8A"/>
  <circle cx="160" cy="452" r="5" fill="#8A8A8A"/>
  <circle cx="280" cy="452" r="5" fill="#8A8A8A"/>
  <circle cx="400" cy="452" r="5" fill="#FFFFFF"/>
  <circle cx="160" cy="508" r="5" fill="#8A8A8A"/>
  <circle cx="280" cy="508" r="5" fill="#8A8A8A"/>
  <circle cx="400" cy="508" r="5" fill="#8A8A8A"/>
  <circle cx="160" cy="564" r="5" fill="#8A8A8A"/>
  <circle cx="280" cy="564" r="5" fill="#8A8A8A"/>
  <circle cx="400" cy="564" r="5" fill="#8A8A8A"/>

  <!-- Data stream from table to nodes -->
  <path d="M 500 280 C 640 260, 760 240, 880 240" fill="none" stroke="#D4D4D4" stroke-width="2" stroke-dasharray="2 10" opacity="0.7"/>
  <circle cx="600" cy="268" r="3" fill="#FFFFFF"/>
  <circle cx="700" cy="252" r="3" fill="#FFFFFF"/>
  <circle cx="790" cy="244" r="3" fill="#FFFFFF"/>

  <!-- Magnifier -->
  <circle cx="600" cy="400" r="95" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="672" y1="472" x2="724" y2="524" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <!-- Bars inside the lens -->
  <line x1="548" y1="480" x2="662" y2="480" stroke="#8A8A8A" stroke-width="1.5"/>
  <rect x="556" y="424" width="26" height="56" fill="#D4D4D4"/>
  <rect x="592" y="384" width="26" height="96" fill="#FFFFFF"/>
  <rect x="628" y="444" width="26" height="36" fill="#8A8A8A"/>
  <!-- Insight dot -->
  <circle cx="600" cy="356" r="22" fill="url(#dotGlow)"/>
  <circle cx="600" cy="356" r="9" fill="#FFFFFF"/>

  <!-- Neural nodes -->
  <line x1="880" y1="240" x2="990" y2="320" stroke="#8A8A8A" stroke-width="1.5" opacity="0.55"/>
  <line x1="990" y1="320" x2="900" y2="420" stroke="#8A8A8A" stroke-width="1.5" opacity="0.55"/>
  <line x1="900" y1="420" x2="1000" y2="500" stroke="#8A8A8A" stroke-width="1.5" opacity="0.55"/>
  <line x1="1000" y1="500" x2="970" y2="650" stroke="#8A8A8A" stroke-width="1.5" opacity="0.55"/>
  <line x1="900" y1="420" x2="860" y2="580" stroke="#8A8A8A" stroke-width="1.5" opacity="0.55"/>
  <line x1="860" y1="580" x2="970" y2="650" stroke="#8A8A8A" stroke-width="1.5" opacity="0.55"/>
  <line x1="880" y1="240" x2="900" y2="420" stroke="#8A8A8A" stroke-width="1.5" opacity="0.55"/>
  <line x1="990" y1="320" x2="1000" y2="500" stroke="#8A8A8A" stroke-width="1.5" opacity="0.55"/>
  <circle cx="880" cy="240" r="11" fill="#FFFFFF"/>
  <circle cx="990" cy="320" r="11" fill="#0A0A0A" stroke="#8A8A8A" stroke-width="2"/>
  <circle cx="900" cy="420" r="11" fill="#FFFFFF"/>
  <circle cx="1000" cy="500" r="11" fill="#0A0A0A" stroke="#8A8A8A" stroke-width="2"/>
  <circle cx="860" cy="580" r="11" fill="#FFFFFF"/>
  <circle cx="970" cy="650" r="11" fill="#0A0A0A" stroke="#8A8A8A" stroke-width="2"/>

  <!-- Insight card -->
  <rect x="120" y="660" width="960" height="64" rx="32" fill="#262626" stroke="#8A8A8A" stroke-width="1.5"/>
  <circle cx="170" cy="692" r="8" fill="#FFFFFF"/>
  <line x1="200" y1="684" x2="360" y2="684" stroke="#8A8A8A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="200" y1="700" x2="300" y2="700" stroke="#8A8A8A" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="1040" cy="692" r="10" fill="#FFFFFF"/>
  <line x1="1040" y1="676" x2="1040" y2="708" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="1024" y1="692" x2="1056" y2="692" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
</svg>